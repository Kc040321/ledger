    if (k === "cat") return openPicker("分类", [{ v: "", label: "不限" }, ...[...S.meta.cats.exp, ...S.meta.cats.inc].map((c) => ({ v: c.id, label: N(c.name) + (S.meta.cats.inc.includes(c) ? L("（收入）", " (income)") : "") + (c.archived ? L("（已归档）", " (archived)") : ""), icon: catIco(c, "sm") }))], f.cat, done);
    if (k === "acct") return openPicker("账户", [{ v: "", label: "不限" }, ...S.meta.accounts.map((a) => ({ v: a.id, label: a.name, icon: acctIco(a, "sm") }))], f.acct, done);
    if (k === "tag") { const tags = [...new Set(D().live.flatMap((t) => t.tags || []))].sort(); return openPicker("标签", [{ v: "", label: "不限" }, ...tags.map((t) => ({ v: t, label: "#" + t }))], f.tag, done); }
  },
  billMore: () => { S.billLimit = (S.billLimit || 150) + 200; paintBillList(); },
  bfReset: () => { S.billLimit = 0; Object.assign(S.bf, { range: "month", type: "", cat: "", acct: "", tag: "", q: "" }); render(); },
  selMode: () => { S.sel = S.sel ? null : new Set(); render(); },
  selT: (d) => { S.sel.has(d.id) ? S.sel.delete(d.id) : S.sel.add(d.id); paintBillList(); paintSelbar(); },
  selAll: () => { const ids = filteredTxs().map((t) => t.id); if (ids.every((id) => S.sel.has(id))) S.sel.clear(); else ids.forEach((id) => S.sel.add(id)); paintBillList(); paintSelbar(); },
  selDel: () => { const ids = [...S.sel]; confirmSheet(L("删除 " + ids.length + " 笔账单", "Delete " + ids.length + " bills"), "", "删除", async () => { S.sel = null; await deleteTxs(ids); render(); }); },
  selCat: () => {
    const sel = [...S.sel].map((id) => S.txs.get(id)).filter(Boolean);
    const exp = sel.filter((t) => t.type === "exp"), inc = sel.filter((t) => t.type === "inc");
    const type = exp.length >= inc.length ? "exp" : "inc", list = type === "exp" ? exp : inc;
    if (!list.length) return toast("选中的账单里没有可改分类的支出或收入");
    openPicker(L(`把 ${list.length} 笔${TN(type)}改为`, `Change ${list.length} ${TN(type)} bills to`), catsOf(type).map((c) => ({ v: c.id, label: c.name, icon: catIco(c, "sm") })), "", async (v) => {
      const old = list.map(clone);
      await Store.bulk(list.map((t) => ({ id: t.id, data: { ...t, cat: v } })));
      S.sel = null; render();
      toast(L(`已修改 ${list.length} 笔`, `Changed ${list.length}`) + (sel.length > list.length ? L(`，${sel.length - list.length} 笔其他类型未改`, `; ${sel.length - list.length} of other types unchanged`) : ""), { undo: () => Store.bulk(old.map((t) => ({ id: t.id, data: t }))) });
    });
  },

  // 资产
  acct: (d) => openAcct(d.id),
  acctEdit: (d) => openAcctEdit(d.id),
  aType: (d) => { const sh = topSheet(); sh.A.type = d.v; paintSheet(sh); },
  aSave: async () => {
    const sh = topSheet(), A0 = sh.A, err = (m) => ($("#aErr").textContent = m);
    const name = (A0.name || "").trim(); if (!name) return err("请填写账户名称");
    if (S.meta.accounts.some((a) => a.name === name && a.id !== A0.id)) return err("已有同名账户");
    let init = A0.init || 0;
    if (A0._init != null) { const v = C.parseYuan(A0._init || "0"); if (v == null) return err("金额格式不对"); init = C.isLiab(A0) ? -v : v; }
    const m = meta2(), x = { ...A0, name, init }; delete x._init;
    const i = m.accounts.findIndex((a) => a.id === x.id); if (i >= 0) m.accounts[i] = x; else m.accounts.push(x);
    await Store.putMeta(m); closeSheet(); toast("已保存");
  },
  aArch: async () => { const sh = topSheet(), m = meta2(), a = m.accounts.find((x) => x.id === sh.A.id); a.archived = !a.archived; await Store.putMeta(m); closeSheet(); toast(a.archived ? "已归档" : "已恢复"); },
  aDel: () => { const sh = topSheet(); confirmSheet("删除账户", "", "删除", async () => { const m = meta2(); m.accounts = m.accounts.filter((a) => a.id !== sh.A.id); await Store.putMeta(m); closeAll(); toast("已删除"); }); },
  acctPay: (d) => { const a = acct(d.id), owed = Math.max(0, -D().bal[a.id].bal); closeSheet(); openForm({ type: "tr", to: a.id, acct: (accts((x) => !C.isLiab(x) && x.type !== "receivable")[0] || {}).id, expr: owed ? centsToExpr(owed) : "", note: a.type === "credit" ? "信用卡还款" : "还款" }); },
  acctCollect: (d) => { const a = acct(d.id), v = Math.max(0, D().bal[a.id].bal); closeSheet(); openForm({ type: "tr", acct: a.id, to: (accts((x) => x.type === "wallet" || x.type === "bank")[0] || {}).id, expr: v ? centsToExpr(v) : "", note: "收回" }); },
  acctTr: (d) => { closeSheet(); openForm({ type: "tr", acct: d.id, to: (accts((x) => x.id !== d.id)[0] || {}).id }); },
  autoNew: (d) => { const main = accts((x) => x.id !== d.id && (x.type === "bank" || x.type === "wallet"))[0]; openRecEdit(null, { type: "tr", freq: "day", auto: true, to: d.id, acct: main ? main.id : "", name: L("自动转入", "Auto transfer to ") + aName(d.id), cat: undefined }); },
  acctBills: (d) => { Object.assign(S.bf, { acct: d.id, range: "all" }); closeAll(); go("bills"); },
  nwInfo: () => {
    const d = D(), nw = C.netWorth(S.meta, d.bal);
    openSheet({ render: () => shHead("净资产") + `<div class="eq"><div class="kv"><span>资产合计</span><span class="num">${F$(nw.assets)}</span></div>${S.meta.accounts.filter((a) => !C.isLiab(a)).map((a) => `<div class="kv tap" data-a="acct" data-id="${a.id}"><span>　${esc(N(a.name))}</span><span class="num">${F$(d.bal[a.id].bal)}</span></div>`).join("")}
      <div class="kv"><span>负债合计</span><span class="num">${F$(nw.liabilities)}</span></div>${S.meta.accounts.filter((a) => C.isLiab(a)).map((a) => `<div class="kv tap" data-a="acct" data-id="${a.id}"><span>　${esc(N(a.name))}</span><span class="num">${F$(-d.bal[a.id].bal)}</span></div>`).join("")}
      <div class="kv"><span style="color:var(--ink);font-weight:600">净资产 = 资产 − 负债</span><span class="num" style="font-weight:600">${F$(nw.net)}</span></div></div>` });
  },

  // 设置
  catMgr: (d) => openCatMgr(d.t || "exp"),
  cmT: (d) => { const sh = topSheet(); sh.type = d.v; paintSheet(sh); },
  cmMove: async (d) => { const sh = topSheet(), m = meta2(), arr = m.cats[sh.type]; const act = arr.filter((c) => !c.archived); const i = act.findIndex((c) => c.id === d.id), j = i + Number(d.d); if (j < 0 || j >= act.length) return; [act[i], act[j]] = [act[j], act[i]]; m.cats[sh.type] = [...act, ...arr.filter((c) => c.archived)]; await Store.putMeta(m); },
  cmUnarch: async (d) => { const sh = topSheet(), m = meta2(); m.cats[sh.type].find((c) => c.id === d.id).archived = false; await Store.putMeta(m); },
  catEdit: (d) => openCatEdit(d.t, d.id),
  ceIcon: (d) => { const sh = topSheet(); sh.Cc.ik = d.v; sh.Cc.icon = ""; if (sh.Cc.hue == null) sh.Cc.hue = hueOf(sh.Cc.id); paintSheet(sh); },
  ceHue: (d) => { const sh = topSheet(); sh.Cc.hue = Number(d.v); if (!sh.Cc.ik) sh.Cc.ik = "box"; paintSheet(sh); },
  ceFixed: () => { const sh = topSheet(); sh.Cc.fixed = !sh.Cc.fixed; paintSheet(sh); },
  ceSave: async () => {
    const sh = topSheet(), name = (sh.Cc.name || "").trim();
    if (!name) return ($("#ceErr").textContent = "请填写名称");
    const m = meta2(), arr = m.cats[sh.type];
    if (arr.some((c) => c.name === name && c.id !== sh.Cc.id && !c.archived)) return ($("#ceErr").textContent = "已有同名分类");
    const i = arr.findIndex((c) => c.id === sh.Cc.id), x = { ...sh.Cc, name }; if (i >= 0) arr[i] = x; else arr.push(x);
    await Store.putMeta(m); closeSheet(); if (F) { if (sh.isNew) F.cat = x.id; refreshForm(); } toast("已保存");
  },
  ceArch: async () => {
    const sh = topSheet(), m = meta2(), arr = m.cats[sh.type];
    if (arr.filter((c) => !c.archived).length <= 1) return ($("#ceErr").textContent = "至少保留一个分类");
    arr.find((c) => c.id === sh.Cc.id).archived = true; await Store.putMeta(m); closeSheet(); if (F) { if (F.cat === sh.Cc.id) F.cat = firstCat(F.type); refreshForm(); } toast("已归档");
  },
  tplMgr: () => openTplMgr(),
  tplDel: async (d) => { const m = meta2(); m.templates = m.templates.filter((t) => t.id !== d.id); await Store.putMeta(m); },
  exportCSV: () => { const n = D().live.length; if (!n) return toast("还没有账单可导出"); saveFile(L("记账-", "ledger-") + stamp() + ".csv", C.toCSV(S.meta, D().txs)); },
  importCSV: () => pickFile("csv"),
  backup: () => saveFile(L("记账备份-", "ledger-backup-") + stamp() + ".json", JSON.stringify({ app: "ledger", v: 1, exportedAt: new Date().toISOString(), meta: (() => { const m = clone(S.meta); delete m.settings.lock; return m; })(), txs: D().txs }, null, 1)),
  restore: () => pickFile("json"),
  impOk: async () => {
    const r = topSheet().r; closeSheet();
    if (r.newAccts.length || r.newCats.length) await Store.putMeta(r.meta);
    const ids = r.txs.map((t) => t.id);
    const fail = await Store.bulk(r.txs.map((t) => ({ id: t.id, data: t })), toastProgress("导入"));
    toast(fail ? L(fail + " 笔导入失败", fail + " imports failed") : L(`已导入 ${r.txs.length} 笔`, `Imported ${r.txs.length}`), { ms: 8000, undo: () => Store.bulk(ids.map((id) => ({ id, data: null }))) });
  },
  restoreOk: async () => { const j = topSheet().j; closeAll(); await replaceAll(j.meta, j.txs, "恢复"); },
  copyTa: async () => { try { await navigator.clipboard.writeText(topSheet().text); toast("已复制"); } catch (e) { const ta = $("textarea", topSheet().body); ta.select(); toast("请长按选择后复制"); } },
  trash: () => openSheet({ live: true, render: () => {
    const del = D().txs.filter((t) => t.deleted).sort((a, b) => b.deleted - a.deleted);
    return shHead("最近删除", del.length ? `<button class="link danger" data-a="trashEmpty">清空</button>` : "") + (del.length ? ``+ del.map((t) => `<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;min-width:0">${itemRow(t).replace('data-a="tx"', "")}</div><button class="btn" data-a="trashRestore" data-id="${esc(t.id)}" style="padding:8px 12px;min-height:38px">恢复</button></div>`).join("") : `<div class="empty"><p>回收站是空的</p></div>`);
  } }),
  trashRestore: (d) => { const t = S.txs.get(d.id); const ids = D().txs.filter((x) => x.deleted && x.deleted === t.deleted).map((x) => x.id); restoreTxs(ids); },
  trashEmpty: () => confirmSheet("彻底删除", "无法恢复", "永久删除", async () => { const ids = D().txs.filter((t) => t.deleted).map((t) => t.id); await Store.bulk(ids.map((id) => ({ id, data: null }))); toast("已清空回收站"); }),
  demo: () => { if (D().txs.some((t) => t.demo)) confirmSheet("清除演示数据", "", "清除", clearDemo); else loadDemo(); },
  clearAll: () => openSheet({ render: () => shHead("清空所有数据") + `<div class="note-box">${L(`将删除全部 ${D().txs.length} 笔账单并重置设置`, `Deletes all ${D().txs.length} bills and resets settings`)}</div>
    <button class="btn block" data-a="backup" style="margin-bottom:10px">先备份</button><p class="small ink2">${L("输入「清空」确认", "Type DELETE to confirm")}</p><div class="field"><input class="inp" id="clrI" autocomplete="off"></div>
    <button class="btn d block" data-a="clearOk" id="clrB" disabled>清空所有数据</button>`, mount: (b) => { $("#clrI", b).oninput = (e) => ($("#clrB", b).disabled = !(e.target.value.trim() === "清空" || e.target.value.trim().toUpperCase() === "DELETE")); } }),
  clearOk: async () => { closeAll(); await replaceAll(C.defaultMeta(), [], "清空"); go("home"); },
  lockSet: () => openLockSet(),
  pin: (d) => { if (!PIN) return; if (d.v === "⌫") PIN.val = PIN.val.slice(0, -1); else if (PIN.val.length < 4) PIN.val += d.v; paintDots(); if (PIN.val.length === 4) { const v = PIN.val; setTimeout(() => PIN && PIN.done(v), 120); } },
  forgot: () => {
    if (A._forgot) return; A._forgot = true;
    const e = $("#lkE"); let n = 30;
    e.textContent = L("应用锁只防随手翻看。30 秒后可以重置密码…", "The lock only stops casual snooping. You can reset it in 30 s…");
    const it = setInterval(async () => { n--; if (n > 0) { e.textContent = L(`应用锁只防随手翻看。${n} 秒后可以重置密码…`, `The lock only stops casual snooping. You can reset it in ${n} s…`); return; } clearInterval(it); A._forgot = false; const m = meta2(); delete m.settings.lock; S.unlocked = true; await Store.putMeta(m); const l = $("#lock"); if (l) l.remove(); PIN = null; toast("已重置，应用锁已关闭"); render(); }, 1000);
  },
  lang: (d) => { if (LANG === d.v) return; LANG = d.v; try { localStorage.setItem("ledger.lang", d.v); } catch (e) {} closeAll(); applyLang(); S._keepScroll = true; S._force = true; render(); S._force = false; toast(L("已切换为简体中文", "Switched to English")); },
  bigFont: () => { const on = document.documentElement.classList.toggle("big"); try { localStorage.setItem("ledger.big", on ? "1" : ""); } catch (e) {} render(); },
};
/** 快捷指令打开网址时带上 ?add=25&note=… 或 ?text=识别出的文字，打开预填好的记账面板，仍需确认 */
function afterReady() {
  if (ANDROID) setTimeout(() => refreshPending(), 0);
  let q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
  if (!q.has("add") && !q.has("text")) return;
  try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
  const go2 = () => { if (S.meta.settings.lock && S.meta.settings.lock.hash && !S.unlocked) return setTimeout(go2, 400); quickOpen(q); };
  setTimeout(go2, 50);
}
function quickOpen(q) {
  const text = [q.get("text"), q.get("add") && "¥" + q.get("add"), q.get("note"), q.get("acct"), q.get("cat")].filter(Boolean).join(" ");
  const r = C.parseQuick(text, S.meta, today());
  if (q.get("type") === "inc") r.type = "inc";
  openForm({ type: r.type, expr: r.amount ? centsToExpr(r.amount) : "", cat: r.cat || undefined, acct: r.acct || undefined, date: r.date, note: q.get("note") || r.note || "" });
  F.info = r.amount ? "¥" + F$(r.amount) : L("未识别到金额", "No amount found");
  refreshForm();
}
function openCustomRange() {
  openSheet({ render: () => shHead("自定义日期") + `<div class="field"><input class="inp" type="date" id="crF" value="${S.bf.from}"><span style="align-self:center">至</span><input class="inp" type="date" id="crT" value="${S.bf.to}"></div><button class="btn p block" data-a="crOk">确定</button>` });
}
A.crOk = () => { S.bf.from = $("#crF").value; S.bf.to = $("#crT").value; S.bf.range = "custom"; closeSheet(); render(); };

/* =================== 启动 =================== */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset, el, e)).catch((x) => { console.error(x); toast(ERRMSG(x)); });
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && sheets.length) closeSheet();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) S.hiddenAt = Date.now();
  else if (S.meta.settings.lock && S.meta.settings.lock.hash && S.unlocked && Date.now() - S.hiddenAt > 60000) { S.unlocked = false; closeAll(); render(); }
});
$("#fileIn").addEventListener("change", onFile);
$("#photoIn").addEventListener("change", (e) => onPhoto(e).catch(() => {}));
// 禁止双指缩放（iOS 会忽略 user-scalable=no，需要在这里拦住）；双击放大由 CSS touch-action 关闭，不影响连续快速点键盘
["gesturestart", "gesturechange", "gestureend"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
try { if (localStorage.getItem("ledger.big")) document.documentElement.classList.add("big"); } catch (e) {}
const PAGES = { home: pageHome, bills: pageBills, stats: pageStats, budget: pageBudget, assets: pageAssets, settings: pageSettings };
C.setL(L);
applyLang();
if (ANDROID) setTimeout(() => refreshPending(), 0);
render();
Store.init();
(window.requestIdleCallback || ((f) => setTimeout(f, 800)))(() => {
  const w = document.createElement("div"); w.setAttribute("aria-hidden", "true");
  w.style.cssText = "position:absolute;left:-9999px;top:0;font-size:20px;visibility:hidden;pointer-events:none";
  w.textContent = [...S.meta.cats.exp, ...S.meta.cats.inc].map((c) => c.icon || "").join("") + "⌫";
  document.body.appendChild(w); setTimeout(() => w.remove(), 3000);
});
window.__ledger = { S, C, D };
})();

</script>
