<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>记账本</title>

<style>
:root{
  --bg:#f4f3ef; --card:#ffffff; --ink:#1c1e21; --ink2:#5e636b; --ink3:#8e939a; --line:#e6e4de; --chip:#edece7;
  --accent:#1f6b5c; --accent-ink:#ffffff; --accent-soft:#e2eeea; --c2:#9db4cc; --inc:#1f8a5b; --warn:#b45309; --danger:#b42318;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 14px rgba(20,20,20,.05);
  --r:16px; font-size:16px;
}
html.big{font-size:18.5px}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121315; --card:#1c1d20; --ink:#ececee; --ink2:#a6aab1; --ink3:#7c8088; --line:#2c2e33; --chip:#26282c;
    --accent:#5fbfa7; --accent-ink:#0d1f1a; --accent-soft:#1d302b; --c2:#6c8cad; --inc:#4fc18a; --warn:#f0a43a; --danger:#f87171;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.inc{color:var(--inc)} .warn{color:var(--warn)} .danger{color:var(--danger)} .muted{color:var(--ink3)} .ink2{color:var(--ink2)}
.small{font-size:.8125rem} .tiny{font-size:.75rem}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 92px)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:6px;gap:8px}
.top h1{font-size:1.3rem;margin:0;font-weight:650}
.top .r{display:flex;gap:4px;align-items:center}
.ibtn{width:44px;height:44px;border:none;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.ibtn:active{background:var(--chip)}
.ibtn svg{width:22px;height:22px}
.back{display:flex;align-items:center;gap:2px;border:none;background:none;padding:10px 6px 10px 0;color:var(--ink2);font-size:1rem;min-height:44px}
.mswitch{display:flex;align-items:center;gap:2px}
.mswitch button{width:36px;height:36px;border:none;background:var(--chip);border-radius:50%;font-size:1.05rem}
.mswitch span{min-width:6.5em;text-align:center;font-weight:600}

.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
@media (prefers-color-scheme: light){.card{border-color:transparent}}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.card-h h2{font-size:.9375rem;margin:0;font-weight:600}
.link{border:none;background:none;color:var(--accent);padding:6px 0;font-size:.875rem;min-height:36px}
.tap{cursor:pointer;border-radius:10px}
.tap:active{background:var(--chip)}

.hero .lab{font-size:.8125rem;color:var(--ink2)}
.hero .big{font-size:2.125rem;font-weight:650;margin:2px 0 8px;line-height:1.15}
.hero .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.hero .grid3>div{padding:4px 6px}
.hero .grid3 .v{font-weight:600;font-size:1.0625rem}
.split-note{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:20px;padding:4px 10px;font-size:.8125rem;color:var(--ink2);border:none;min-height:30px}

.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .25s}
.bar.over i{background:var(--warn)}
.brow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}

.crow{display:flex;align-items:center;gap:10px;padding:9px 6px;margin:0 -6px}
.crow .ico{flex:none}
.crow .mid{flex:1;min-width:0}
.crow .mid .bar{margin-top:5px;height:6px}
.crow .v{text-align:right;flex:none}

.ico{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:1.05rem;flex:none}
.day{margin-bottom:10px;padding:6px 14px}
.day-h{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--ink3);padding:8px 0 4px}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);min-height:56px}
.day .item:first-of-type{border-top:none}
.item .mid{flex:1;min-width:0}
.item .t1{font-size:.9375rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .t2{font-size:.75rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;text-align:right;flex:none}
.item .amt small{display:block;font-weight:400;font-size:.6875rem;color:var(--ink3)}
.tag{font-size:.6875rem;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--ink2);font-weight:500}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none;display:grid;place-items:center}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.empty{text-align:center;padding:26px 10px;color:var(--ink2)}
.empty .e1{font-size:2.2rem;margin-bottom:6px}
.empty h3{margin:4px 0 6px;font-size:1.0625rem;color:var(--ink)}
.empty p{margin:0 0 14px;font-size:.875rem}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:600;min-height:46px;background:var(--chip)}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.d{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}

.due{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.due:first-of-type{border-top:none}
.due .mid{flex:1;min-width:0}
.due button{border:none;border-radius:10px;padding:8px 12px;min-height:38px;font-size:.875rem}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:4px 6px calc(env(safe-area-inset-bottom) + 4px);z-index:5}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink3);padding:10px 0;min-height:52px}
.tabs button svg{width:26px;height:26px}
.tabs button.on{color:var(--accent)}
.tabs .add{justify-self:center;width:56px;height:56px;min-height:56px;padding:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);margin-top:-14px;box-shadow:0 6px 16px rgba(31,107,92,.35)}
.tabs .add b{font-size:2rem;line-height:1;font-weight:300}

/* sheets */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:94vh;max-height:94dvh;overflow:auto;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);animation:up .2s ease-out;overscroll-behavior:contain}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:40px}
.sh-h h3{margin:0;font-size:1.0625rem}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.mask,.sheet{animation:none}}

.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:10px;font-size:.9375rem;color:var(--ink2);min-height:38px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 8px}
.cats button{border:none;background:none;border-radius:12px;padding:6px 0;font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);min-height:60px}
.cats button .ico{width:40px;height:40px;font-size:1.15rem}
.cats button.on{color:var(--ink);font-weight:600}
.cats button.on .ico{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:.8125rem;white-space:nowrap;min-height:36px;color:var(--ink2)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.lbl{font-size:.75rem;color:var(--ink3);margin:8px 0 4px}

.field{display:flex;gap:8px;margin:6px 0}
.inp{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9375rem;min-height:44px}
.inp:focus{outline:none;border-color:var(--accent)}
input[type=date].inp{flex:0 0 auto}

.amtbox{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 2px;border-top:1px solid var(--line);margin-top:6px}
.amtbox .expr{font-size:.875rem;color:var(--ink3);min-height:1.2em}
.amtbox .val{font-size:2rem;font-weight:650}
.err{color:var(--danger);font-size:.8125rem;min-height:1.2em;margin:2px 0}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad button{border:none;background:var(--chip);border-radius:12px;height:52px;font-size:1.3rem;font-weight:500}
.pad button:active{filter:brightness(.92)}
.pad .ok{background:var(--accent);color:var(--accent-ink);font-size:1.05rem;font-weight:600}
.pad .sub{font-size:.9375rem}
details.more{border-top:1px solid var(--line);margin-top:6px;padding:4px 0}
details.more summary{font-size:.8125rem;color:var(--ink2);padding:8px 0;cursor:pointer;list-style:none}
details.more summary::-webkit-details-marker{display:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;min-height:44px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);border:none;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
.quick{display:flex;gap:6px;margin-bottom:4px}
.hint{font-size:.75rem;color:var(--ink3);margin:2px 0 6px}
.note-box{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.8125rem;margin:6px 0}

.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:52px;width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.list-row:first-child{border-top:none}
.list-row .mid{flex:1;min-width:0}
.list-row .arrow{color:var(--ink3)}
.group-t{font-size:.8125rem;color:var(--ink3);margin:16px 4px 6px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);gap:12px}
.kv:first-child{border-top:none}
.kv span:first-child{color:var(--ink2)}
.eq{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}

.search{display:flex;gap:8px;margin-bottom:8px}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
.selbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);z-index:40;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:10px 10px 10px 16px;font-size:.9375rem;display:flex;align-items:center;gap:12px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{border:none;background:none;color:var(--accent);font-weight:700;padding:6px 8px;min-height:36px}
@media (prefers-color-scheme: light){.toast button{color:#8fe0c9}}

.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.dots{display:flex;gap:14px;margin:18px 0 24px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink2)}
.dots i.on{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pinpad button{width:72px;height:72px;border-radius:50%;border:none;background:var(--chip);font-size:1.5rem}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font-size:11px}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--inc);margin-right:5px;vertical-align:1px}
.status-dot.off{background:var(--warn)}
.prose p{margin:0 0 10px;font-size:.9rem;color:var(--ink2)}
.prose h4{margin:14px 0 6px;font-size:.9375rem}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid button{border:none;background:var(--chip);border-radius:10px;height:40px;font-size:1.2rem}
.emoji-grid button.on{box-shadow:inset 0 0 0 2px var(--accent)}
textarea.inp{min-height:140px;font-size:.75rem;font-family:ui-monospace,Menlo,monospace}

.formsheet{padding-bottom:0}
.padwrap{position:sticky;bottom:0;background:var(--card);margin:0 -16px;padding:2px 16px calc(env(safe-area-inset-bottom) + 12px);box-shadow:0 -6px 12px -8px rgba(0,0,0,.12);z-index:1}
.formsheet .cats{gap:2px;margin:10px 0 4px}
.formsheet .cats button{min-height:54px;padding:3px 0}
.formsheet .cats button .ico{width:36px;height:36px;font-size:1.05rem}
.formsheet .amtbox{border-top:none;margin-top:0;padding:6px 2px}
.formsheet .pad button{height:48px}
.toast span{flex:1}
.toast button{white-space:nowrap;flex:none}

/* 顺滑：去掉点击延迟、按下反馈、关闭动画、离屏卡片跳过渲染 */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.pad button,.chip,.btn,.cats button,.seg button,.pill,.mswitch button,.tabs button,.due button,.ibtn,.pinpad button,.emoji-grid button{transition:transform .08s ease,background-color .12s ease,color .12s ease}
.pad button:active,.chip:active,.btn:active,.cats button:active,.pill:active,.mswitch button:active,.due button:active,.pinpad button:active,.emoji-grid button:active{transform:scale(.95)}
.tabs .add:active{transform:scale(.94)}
.cats button .ico{transition:background-color .12s ease,box-shadow .12s ease}
.tap{transition:background-color .12s ease}
.day{content-visibility:auto;contain-intrinsic-size:auto 260px}
#app.fade{animation:pagein .14s ease-out}
@keyframes pagein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.mask.closing{animation:fadeout .17s ease-in forwards;pointer-events:none}
.mask.closing .sheet{animation:down .17s ease-in forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes down{to{transform:translateY(40px);opacity:0}}
.sheet{will-change:transform;-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion: reduce){#app.fade,.mask.closing,.mask.closing .sheet{animation:none}.pad button:active,.chip:active,.btn:active{transform:none}}

/* 输入框字号不小于 16px，否则 iOS 聚焦时会自动放大页面 */
input,select,textarea,.inp{font-size:max(16px,1rem)!important}

/* ================= 视觉整理：图标、配色、层次 ================= */
:root{ --bg:#f5f5f2; --line:#ebe9e3; --chip:#efeee9; --r:18px; --shadow:0 1px 1px rgba(20,20,20,.02),0 2px 12px rgba(20,20,20,.045); }
@media (prefers-color-scheme: dark){ :root{ --bg:#111214; --card:#1b1c1f; --line:#2a2c30; --chip:#24262a; } }
body{letter-spacing:.005em}

/* 圆形图标：浅色底 + 同色系线条，颜色由 --h（色相）和 --s（饱和度系数）决定 */
.ico{--h:220;--s:1;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:1.05rem;
  background:hsl(var(--h) calc(var(--s) * 52%) 94.5%);color:hsl(var(--h) calc(var(--s) * 40%) 38%)}
.ico svg{width:21px;height:21px}
.ico.sm{width:22px;height:22px;border-radius:7px;margin-right:6px;background:transparent}
.ico.sm svg{width:17px;height:17px}
.ico.lg{width:52px;height:52px;border-radius:16px}.ico.lg svg{width:27px;height:27px}
.ico.xl{width:60px;height:60px;border-radius:18px;margin:0 auto}.ico.xl svg{width:30px;height:30px}
@media (prefers-color-scheme: dark){
  .ico{background:hsl(var(--h) calc(var(--s) * 18%) 20%);color:hsl(var(--h) calc(var(--s) * 55%) 74%)}
  .ico.sm{background:transparent}
}
.empty .e1{display:flex;justify-content:center;font-size:inherit;margin-bottom:10px}
.lock>.ico{margin-bottom:4px}

/* 卡片与标题 */
.card{border-radius:var(--r);padding:16px 16px}
.card-h h2{font-size:.9375rem;font-weight:600;letter-spacing:.01em}
.top h1{font-weight:700;letter-spacing:.01em}
.mswitch button{background:transparent;color:var(--ink2);font-size:1.25rem}
.mswitch button:active{background:var(--chip)}
.mswitch span{font-size:1.0625rem}
.hero .big{font-size:2.25rem;font-weight:700;letter-spacing:-.02em;margin:4px 0 10px}
.hero .grid3{border-top:none;padding-top:4px;gap:8px}
.hero .grid3>div{background:var(--bg);border-radius:12px;padding:8px 10px}
.hero .grid3 .lab{font-size:.75rem}
.pill{background:var(--bg)}

/* 列表：分隔线从文字处开始，不穿过图标 */
.item{border-top:none;gap:12px;min-height:58px}
.item + .item{box-shadow:inset 50px 0 0 var(--card),inset 0 1px 0 var(--line)}
.item .t1{font-size:.9375rem;font-weight:500}
.item .amt{font-size:.9375rem}
.day{padding:4px 14px}
.day-h{padding:10px 0 2px;font-size:.75rem;letter-spacing:.02em}
.list-row{gap:12px}
.list-row + .list-row,.list-row:not(:first-child){border-top:none;box-shadow:inset 50px 0 0 var(--card),inset 0 1px 0 var(--line)}
.list-row .ico{width:34px;height:34px;border-radius:10px}
.list-row .ico svg{width:19px;height:19px}
.crow{padding:8px 6px}
.crow .mid .bar{height:5px}
.bar{height:7px;border-radius:4px}
.bar.tint i{background:hsl(var(--h) calc(var(--s) * 38%) 56%)}
@media (prefers-color-scheme: dark){ .bar.tint i{background:hsl(var(--h) calc(var(--s) * 45%) 62%)} }
.due{border-top:none}
.due + .due{box-shadow:inset 50px 0 0 var(--card),inset 0 1px 0 var(--line)}

/* 记账面板 */
.cats{gap:4px 2px}
.cats button{color:var(--ink2)}
.cats button .ico{width:44px;height:44px;border-radius:14px;transition:box-shadow .15s ease,transform .1s ease}
.cats button.on .ico{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px hsl(var(--h) calc(var(--s) * 45%) 50%)}
.formsheet .cats button .ico{width:40px;height:40px;border-radius:13px}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:6px 13px}
.chip svg{width:15px;height:15px;margin-right:4px;flex:none}
.chip .ico.sm{margin:0 4px 0 -4px;color:hsl(var(--h) calc(var(--s) * 40%) 42%)}
.chip.on .ico.sm{color:var(--accent)}
.quick .btn svg{width:20px;height:20px;display:block}
.padwrap{background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.pad button{background:var(--card);box-shadow:0 1px 0 rgba(0,0,0,.05);font-weight:400}
.pad .ok{background:var(--accent);box-shadow:none}
.amtbox .val{font-weight:700;letter-spacing:-.02em}
.list-row .mid .ico.sm,.list-row>.mid>.ico.sm{vertical-align:-5px}
.list-row .mid{display:block}

/* 分类编辑：图标网格和颜色 */
.glyph-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.glyph-grid button{border:none;background:var(--bg);border-radius:10px;height:40px;display:grid;place-items:center;color:var(--ink2)}
.glyph-grid button svg{width:20px;height:20px}
.glyph-grid button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 6px}
.swatches button{width:30px;height:30px;border-radius:50%;border:none;background:hsl(var(--h) calc(var(--s) * 45%) 62%)}
.swatches button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px hsl(var(--h) calc(var(--s) * 45%) 45%)}

/* 底栏 */
.tabs{border-top-color:var(--line)}
.tabs button.on{color:var(--accent)}
.tabs .add{border-radius:20px}
.cats button.on .ico{background:hsl(var(--h) calc(var(--s) * 52%) 94.5%)}
@media (prefers-color-scheme: dark){ .cats button.on .ico{background:hsl(var(--h) calc(var(--s) * 18%) 20%)} }
.item,.list-row,.due{border-radius:0}
.toggle .ico{width:34px;height:34px;border-radius:10px}.toggle .ico svg{width:19px;height:19px}

<script>
/* 账务核心：纯函数，不碰 DOM。金额一律以「分」为整数存储。 */
const Core = (() => {
  let L = (zh, en) => zh; // 界面语言由 app 注入
  const setL = (f) => { L = f; };
  const ACCT_TYPES = {
    cash:       { name: "现金",       liab: false, icon: "💵" },
    bank:       { name: "银行卡",     liab: false, icon: "🏦" },
    wallet:     { name: "余额账户",   liab: false, icon: "👛" },
    receivable: { name: "借出/应收",  liab: false, icon: "🤝" },
    credit:     { name: "信用卡",     liab: true,  icon: "💳" },
    loan:       { name: "借入/其他负债", liab: true, icon: "📄" },
  };
  const TYPE_NAMES = { exp: "支出", inc: "收入", tr: "转账", refund: "退款", reimb: "报销收款" };
  const NAME_TYPES = Object.fromEntries(Object.entries(TYPE_NAMES).map(([k, v]) => [v, k]));

  let _n = 0;
  const uid = (p) => p + Date.now().toString(36) + (_n++).toString(36) + Math.random().toString(36).slice(2, 6);

  /* ---------- 金额 ---------- */
  function parseYuan(s) {
    s = String(s == null ? "" : s).trim().replace(/[,，¥￥\s]/g, "");
    if (!/^-?\d+(\.\d{0,2})?$/.test(s)) return null;
    const neg = s.startsWith("-"); if (neg) s = s.slice(1);
    const [i, d = ""] = s.split(".");
    const c = parseInt(i, 10) * 100 + parseInt((d + "00").slice(0, 2), 10);
    return neg ? -c : c;
  }
  /** 键盘表达式，如 "12.5+8-3"，结果为分；非法返回 null */
  function evalExpr(expr) {
    expr = String(expr || "").replace(/\s/g, "");
    if (!expr) return null;
    const parts = expr.match(/[+\-]?[^+\-]+/g);
    if (!parts || parts.join("") !== expr) return null;
    let sum = 0;
    for (const p of parts) {
      const sign = p[0] === "-" ? -1 : 1;
      const body = p.replace(/^[+\-]/, "");
      const c = parseYuan(body);
      if (c == null) return null;
      sum += sign * c;
    }
    return sum;
  }
  function fmt(c, opt = {}) {
    const neg = c < 0; c = Math.abs(Math.round(c));
    const y = Math.floor(c / 100), f = String(c % 100).padStart(2, "0");
    const s = y.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + f;
    const sign = neg ? "−" : (opt.plus && c > 0 ? "+" : "");
    return sign + (opt.sym ? "¥" : "") + s;
  }

  /* ---------- 日期 ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const ymOf = (date) => String(date).slice(0, 7);
  function addMonths(ym, n) {
    let [y, m] = ym.split("-").map(Number);
    m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
    return y + "-" + pad(m);
  }
  const daysInMonth = (ym) => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
  function monthsBetween(a, b) { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); }

  /* ---------- 默认数据 ---------- */
  function defaultMeta() {
    return {
      v: 1,
      accounts: [
        { id: "a_cash", name: "现金", type: "cash", init: 0 },
        { id: "a_wx", name: "微信零钱", type: "wallet", init: 0 },
        { id: "a_ali", name: "支付宝", type: "wallet", init: 0 },
        { id: "a_bank", name: "银行卡", type: "bank", init: 0 },
        { id: "a_cc", name: "信用卡", type: "credit", init: 0 },
      ],
      cats: {
        exp: [
          ["c_food", "餐饮", "🍚"], ["c_traffic", "交通", "🚌"], ["c_shop", "购物", "🛍️"], ["c_daily", "日用", "🧴"],
          ["c_fun", "娱乐", "🎬"], ["c_study", "学习", "📚"], ["c_phone", "通讯", "📱"], ["c_sub", "订阅", "🔁"],
          ["c_med", "医疗", "💊"], ["c_gift", "人情", "🎁"], ["c_rent", "住房", "🏠", true], ["c_ins", "保险", "🛡️", true],
          ["c_other", "其他", "📦"],
        ].map(([id, name, icon, fixed]) => ({ id, name, icon, fixed: !!fixed })),
        inc: [
          ["i_allow", "生活费", "💰"], ["i_salary", "工资", "💼"], ["i_part", "兼职", "🧾"], ["i_scholar", "奖学金", "🏅"],
          ["i_red", "红包", "🧧"], ["i_other", "其他", "📦"],
        ].map(([id, name, icon]) => ({ id, name, icon })),
      },
      budgets: { total: 0, cats: {}, includeFixed: false },
      templates: [],
      recurring: [],
      settings: { lastCat: { exp: "c_food", inc: "i_allow" }, lastAcct: "a_wx", amortView: false },
    };
  }
  /** 补齐旧数据缺失的字段，保证后续代码可以放心读取 */
  function normalizeMeta(m) {
    const d = defaultMeta();
    if (!m || typeof m !== "object") return d;
    const out = { ...d, ...m };
    out.accounts = Array.isArray(m.accounts) && m.accounts.length ? m.accounts : d.accounts;
    out.cats = { exp: (m.cats && m.cats.exp) || d.cats.exp, inc: (m.cats && m.cats.inc) || d.cats.inc };
    out.budgets = { ...d.budgets, ...(m.budgets || {}) };
    out.budgets.cats = out.budgets.cats || {};
    out.templates = m.templates || [];
    out.recurring = m.recurring || [];
    out.settings = { ...d.settings, ...(m.settings || {}) };
    out.settings.lastCat = { ...d.settings.lastCat, ...((m.settings || {}).lastCat || {}) };
    return out;
  }

  const acctById = (meta, id) => meta.accounts.find((a) => a.id === id);
  const catById = (meta, id) => meta.cats.exp.find((c) => c.id === id) || meta.cats.inc.find((c) => c.id === id);
  const isLiab = (a) => !!(a && ACCT_TYPES[a.type] && ACCT_TYPES[a.type].liab);
  const live = (txs) => txs.filter((t) => !t.deleted);

  /* ---------- 余额 ---------- */
  /** 每个账户：期初 + 流入 − 流出 = 余额。负债账户余额为负数，表示欠款。 */
  function balances(meta, txs) {
    const b = {};
    for (const a of meta.accounts) b[a.id] = { init: a.init || 0, inflow: 0, outflow: 0, bal: a.init || 0 };
    const add = (id, c) => {
      if (!b[id]) b[id] = { init: 0, inflow: 0, outflow: 0, bal: 0, missing: true };
      if (c >= 0) b[id].inflow += c; else b[id].outflow -= c;
      b[id].bal += c;
    };
    for (const t of live(txs)) {
      const a = t.amount;
      if (t.type === "exp") add(t.acct, -a);
      else if (t.type === "inc" || t.type === "refund" || t.type === "reimb") add(t.acct, a);
      else if (t.type === "tr") { add(t.acct, -a); add(t.to, a); }
    }
    return b;
  }
  /** 净资产 = 资产 − 负债 */
  function netWorth(meta, bal) {
    let assets = 0, liabilities = 0;
    for (const a of meta.accounts) {
      const v = (bal[a.id] || { bal: 0 }).bal;
      if (isLiab(a)) liabilities += -v; else assets += v;
    }
    return { assets, liabilities, net: assets - liabilities };
  }

  /* ---------- 统计行：所有汇总都从这里求和，因此都能下钻 ---------- */
  /**
   * kind:
   *  spend   计入消费（退款为负数冲减原分类）
   *  income  计入收入
   *  adv     报销垫付（不计入个人消费；报销到账时用负数冲回）
   * 转账、信用卡还款、借出借入、代付应收都不产生统计行，只改余额。
   */
  function lines(meta, txs, opt = {}) {
    const byId = new Map(txs.map((t) => [t.id, t]));
    const out = [];
    for (const t of live(txs)) {
      if (t.type === "exp") {
        const cat = catById(meta, t.cat);
        const kind = t.reimbursable ? "adv" : "spend";
        const n = opt.amort && t.amort > 1 && kind === "spend" ? Math.min(60, Math.floor(t.amort)) : 1;
        const base = Math.floor(t.amount / n), rem = t.amount - base * n;
        for (let k = 0; k < n; k++) {
          out.push({ tx: t, kind, ym: addMonths(ymOf(t.date), k), cat: t.cat, acct: t.acct,
            fixed: !!(cat && cat.fixed), amt: base + (k < rem ? 1 : 0), part: n > 1 ? (k + 1) + "/" + n : "" });
        }
      } else if (t.type === "refund") {
        const o = byId.get(t.refId);
        const live0 = o && !o.deleted ? o : null;
        const catId = live0 ? live0.cat : t.cat;
        const cat = catById(meta, catId);
        out.push({ tx: t, kind: live0 && live0.reimbursable ? "adv" : "spend", ym: ymOf(t.date), cat: catId,
          acct: t.acct, fixed: !!(cat && cat.fixed), amt: -t.amount, part: "", refund: true });
      } else if (t.type === "reimb") {
        out.push({ tx: t, kind: "adv", ym: ymOf(t.date), cat: t.cat, acct: t.acct, fixed: false, amt: -t.amount, part: "", reimb: true });
      } else if (t.type === "inc") {
        out.push({ tx: t, kind: "income", ym: ymOf(t.date), cat: t.cat, acct: t.acct, fixed: false, amt: t.amount, part: "" });
      }
    }
    return out;
  }
  const sum = (ls) => ls.reduce((s, l) => s + l.amt, 0);
  function groupSum(ls, key) {
    const m = new Map();
    for (const l of ls) { const k = l[key]; m.set(k, (m.get(k) || 0) + l.amt); }
    return [...m.entries()].map(([k, amt]) => ({ key: k, amt })).sort((a, b) => b.amt - a.amt);
  }
  function monthSummary(ls, ym) {
    const m = ls.filter((l) => l.ym === ym);
    const spend = m.filter((l) => l.kind === "spend");
    const income = m.filter((l) => l.kind === "income");
    return {
      spendLines: spend, incomeLines: income,
      spend: sum(spend), income: sum(income),
      daily: sum(spend.filter((l) => !l.fixed)), fixed: sum(spend.filter((l) => l.fixed)),
      byCat: groupSum(spend, "cat").filter((g) => g.amt !== 0),
      byAcct: groupSum(spend, "acct").filter((g) => g.amt !== 0),
    };
  }

  /* ---------- 退款 / 报销额度 ---------- */
  function linked(txs, id) { return live(txs).filter((t) => t.refId === id); }
  function refundable(txs, exp, exceptId) {
    const ls = linked(txs, exp.id).filter((t) => t.id !== exceptId);
    const refunded = ls.filter((t) => t.type === "refund").reduce((s, t) => s + t.amount, 0);
    const reimbursed = ls.filter((t) => t.type === "reimb").reduce((s, t) => s + t.amount, 0);
    return { refunded, reimbursed, maxRefund: exp.amount - refunded - reimbursed, maxReimb: exp.amount - refunded - reimbursed };
  }
  function pendingReimb(txs) {
    return live(txs).filter((t) => t.type === "exp" && t.reimbursable)
      .map((t) => ({ tx: t, left: refundable(txs, t).maxReimb })).filter((x) => x.left > 0);
  }

  /* ---------- AA ----------
   * 一次 AA 由同一个 group 串起来：
   *  我的份额：exp（付款账户）
   *  别人应付：tr 付款账户 → 应收账户（带 aa 信息）
   *  收到还款：tr 应收账户 → 收款账户（aaPay）
   *  不收了：  exp 从应收账户支出（aaWaive），计入自己的消费
   * 所以收款从不算收入，未收回的部分最终才算自己的支出。 */
  function aaGroups(meta, txs) {
    const L = live(txs), out = [];
    const isRecv = (id) => { const a = acctById(meta, id); return !!a && a.type === "receivable"; };
    for (const t of L) {
      if (t.type !== "tr" || !t.group || t.aaPay || !isRecv(t.to)) continue;
      const g = t.group, recv = t.to;
      const mine = L.find((x) => x.group === g && x.type === "exp" && x.acct !== recv);
      const pays = L.filter((x) => x.group === g && x.type === "tr" && x.acct === recv);
      const waive = L.filter((x) => x.group === g && x.type === "exp" && x.acct === recv);
      const collected = pays.reduce((s, x) => s + x.amount, 0), waived = waive.reduce((s, x) => s + x.amount, 0);
      const aa = t.aa || {}, names = aa.names || [];
      const people = aa.people || names.length || 0;
      const paidBy = new Set(pays.map((p) => p.aaWho).filter(Boolean));
      out.push({ g, owe: t, mine, recv, owed: t.amount, total: t.amount + (mine ? mine.amount : 0), collected, waived,
        left: t.amount - collected - waived, people, per: people ? Math.round(t.amount / people) : 0, names,
        paid: names.filter((n) => paidBy.has(n)), unpaid: names.filter((n) => !paidBy.has(n)), paidCount: paidBy.size || pays.length,
        pays, waive, cat: mine ? mine.cat : t.aaCat, date: t.date, title: t.note || "AA" });
    }
    return out.sort((a, b) => b.date.localeCompare(a.date));
  }
  /** 拆分 AA：total 总额，n 总人数（含自己）。返回 [我的份额, 别人合计] */
  function aaSplit(total, n) { const per = Math.round(total / n); const others = per * (n - 1); return [total - others, others, per]; }

  /* ---------- 预算 ---------- */
  function budgetStatus(meta, ls, ym, today) {
    const s = monthSummary(ls, ym);
    const B = meta.budgets;
    const usedLines = B.includeFixed ? s.spendLines : s.spendLines.filter((l) => !l.fixed);
    const used = sum(usedLines);
    const dim = daysInMonth(ym);
    const tym = ymOf(today);
    const daysLeft = ym === tym ? dim - Number(today.slice(8, 10)) + 1 : (ym > tym ? dim : 0);
    const remaining = B.total - used;
    const cats = Object.entries(B.cats || {}).filter(([, v]) => v > 0).map(([cat, budget]) => {
      const cl = s.spendLines.filter((l) => l.cat === cat);
      const u = sum(cl);
      return { cat, budget, used: u, remaining: budget - u, lines: cl };
    });
    return { total: B.total, used, usedLines, remaining, daysLeft, perDay: daysLeft > 0 && remaining > 0 ? Math.floor(remaining / daysLeft) : 0, cats };
  }

  /* ---------- 周期账单 ----------
   * freq: month（每月 day 日）| week（每周 wday，0=周日）| day（每天）
   * startDate / end：起止日期（含）。旧规则只有 start（YYYY-MM），按当月 1 日算。
   * auto：银行自动执行的转账，不生成账单文档，按日期推算后计入余额。 */
  function addDays(d, n) { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return ymd(x); }
  const ruleStart = (r, fallback) => r.startDate || (r.start ? r.start + "-01" : fallback);
  function occurrences(r, from, to) {
    const s0 = ruleStart(r, from), endD = r.end && r.end < to ? r.end : to;
    const begin = s0 > from ? s0 : from, out = [];
    if (begin > endD) return out;
    const f = r.freq || "month";
    if (f === "day") { for (let d = begin; d <= endD && out.length < 4000; d = addDays(d, 1)) out.push(d); }
    else if (f === "week") {
      let d = begin; const wd = new Date(d + "T00:00:00").getDay(), want = r.wday == null ? 1 : r.wday;
      d = addDays(d, (want - wd + 7) % 7);
      for (; d <= endD && out.length < 1000; d = addDays(d, 7)) out.push(d);
    } else {
      for (let ym = ymOf(begin); ym <= ymOf(endD); ym = addMonths(ym, 1)) {
        const d = ym + "-" + pad(Math.min(r.day || 1, daysInMonth(ym)));
        if (d >= begin && d <= endD) out.push(d);
      }
    }
    return out;
  }
  const occKey = (r, date) => ((r.freq || "month") === "month" ? ymOf(date) : date);
  /** 需要确认的周期账单：已到期、未记入也未跳过。回看：每月 2 个月、每周 8 周、每天 14 天 */
  function dueRecurring(meta, txs, today) {
    const out = [];
    for (const r of meta.recurring) {
      if (r.active === false || r.auto) continue;
      const f = r.freq || "month";
      const from = f === "month" ? addMonths(ymOf(today), -2) + "-01" : addDays(today, f === "week" ? -56 : -13);
      for (const date of occurrences(r, from, today)) {
        const key = occKey(r, date);
        if ((r.skipped || []).includes(key)) continue;
        if (txs.some((t) => t.recId === r.id && t.recMonth === key)) continue; // 含已删除：删除即视为处理过
        out.push({ rule: r, ym: key, date });
      }
    }
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
  /** 自动执行的转账：按日期推算出来的虚拟账单，只用于余额，不写入数据库 */
  function autoTxs(meta, today) {
    const out = [];
    for (const r of meta.recurring) {
      if (!r.auto || r.type !== "tr" || !(r.amount > 0)) continue;
      if (r.active === false && !r.end) continue;
      for (const date of occurrences(r, "2000-01-01", today)) {
        if ((r.skipped || []).includes(date)) continue;
        out.push({ id: "v_" + r.id + "_" + date, type: "tr", amount: r.amount, acct: r.acct, to: r.to, date, note: r.name, recId: r.id, virtual: true });
      }
    }
    return out;
  }

  /* ---------- 分类变化解释 ---------- */
  /** cutDay：比较当月未过完时，上月只取同期（1 日到 cutDay 日），避免半个月和整月比 */
  function categoryChanges(ls, ym, cutDay) {
    const prev = addMonths(ym, -1);
    const inCut = (l) => !cutDay || (l.part ? true : Number(l.tx.date.slice(8, 10)) <= cutDay);
    const cur = ls.filter((l) => l.kind === "spend" && l.ym === ym && inCut(l));
    const old = ls.filter((l) => l.kind === "spend" && l.ym === prev && inCut(l));
    const cats = new Set([...cur, ...old].map((l) => l.cat));
    const res = [];
    for (const c of cats) {
      const a = sum(cur.filter((l) => l.cat === c)), b = sum(old.filter((l) => l.cat === c));
      if (a === b) continue;
      const side = (a > b ? cur : old).filter((l) => l.cat === c).sort((x, y) => y.amt - x.amt);
      res.push({ cat: c, now: a, before: b, diff: a - b, top: side.slice(0, 2), curLines: cur.filter((l) => l.cat === c), oldLines: old.filter((l) => l.cat === c) });
    }
    return res.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));
  }

  /* ---------- 校验 ---------- */
  function validate(meta, txs, t) {
    if (!Number.isInteger(t.amount) || t.amount <= 0) return "金额必须大于 0";
    if (t.amount > 100000000000) return "金额太大了";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.date || "")) return "请选择日期";
    if (!acctById(meta, t.acct)) return "请选择账户";
    if (t.type === "tr") {
      if (!acctById(meta, t.to)) return "请选择转入账户";
      if (t.to === t.acct) return "转出和转入不能是同一个账户";
    }
    if (t.type === "exp" || t.type === "inc") { if (!catById(meta, t.cat)) return "请选择分类"; }
    if (t.type === "refund" || t.type === "reimb") {
      const o = txs.find((x) => x.id === t.refId && !x.deleted);
      if (!o) return "找不到原账单";
      const r = refundable(txs, o, t.id);
      if (t.type === "reimb" && !o.reimbursable) return "原账单没有标记为报销垫付";
      if (t.amount > r.maxRefund) return L("超过原账单可" + (t.type === "refund" ? "退款" : "报销") + "金额 " + fmt(r.maxRefund), "More than the " + fmt(r.maxRefund) + " that can still be " + (t.type === "refund" ? "refunded" : "reimbursed"));
    }
    return "";
  }

  /* ---------- 一句话记账（结果只用于预填，需用户确认） ---------- */
  const INCOME_WORDS = /(工资|收入|收到|进账|生活费|奖学金|兼职|红包|报酬|稿费)/;
  const CAT_WORDS = {
    c_food: /(饭|餐|早餐|午饭|午餐|晚饭|晚餐|外卖|奶茶|咖啡|零食|水果|食堂|夜宵|饮料|美团|饿了么|肯德基|麦当劳|瑞幸|星巴克|喜茶|蜜雪|面包|碗|粉|面馆|拉面|麻辣烫|火锅|烧烤|餐厅|饭店|食府|小吃|汉堡|披萨|炸鸡|轻食|沙拉|便当|快餐|茶饮|甜品|烘焙|库迪|霸王茶姬|茶百道|古茗|沪上阿姨|华莱士|塔斯汀|必胜客|海底捞)/,
    c_traffic: /(地铁|公交|打车|滴滴|高铁|火车|机票|车费|单车|加油|停车|12306|哈啰|高德)/,
    c_shop: /(淘宝|京东|衣服|鞋|买了|网购|拼多多)/, c_daily: /(日用|纸巾|洗发|超市|洗衣)/,
    c_fun: /(电影|游戏|KTV|演出|门票|旅游)/i, c_study: /(书|课|打印|文具|考试|报名)/,
    c_phone: /(话费|流量|宽带)/, c_sub: /(会员|订阅|视频|音乐|网盘)/, c_med: /(药|医院|看病|挂号)/,
    c_gift: /(礼物|份子|请客)/, c_rent: /(房租|水电|物业)/, c_ins: /(保险)/,
  };
  function parseQuick(text, meta, today) {
    const r = { type: "exp", amount: null, cat: null, acct: null, date: today, note: "" };
    if (!text) return r;
    // 优先取带 ¥ 的金额，其次带两位小数的数字，避免把日期、时间、订单号当成金额
    const m = text.match(/[¥￥]\s*-?\s*(\d+(?:,\d{3})*(?:\.\d{1,2})?)/) || text.match(/-\s?(\d+(?:,\d{3})*\.\d{2})(?!\d)/) || text.match(/(?<![\d:\-\/.])(\d+(?:,\d{3})*\.\d{2})(?![\d:])/) || text.match(/(?<![\d:\-\/.])(\d{1,6}(?:\.\d{1,2})?)\s*(元|块)?(?![\d:\-\/])/);
    if (m) r.amount = parseYuan(m[1].replace(/,/g, ""));
    if (INCOME_WORDS.test(text)) r.type = "inc";
    const d = new Date(today + "T00:00:00");
    if (/前天/.test(text)) { d.setDate(d.getDate() - 2); r.date = ymd(d); }
    else if (/昨天|昨晚/.test(text)) { d.setDate(d.getDate() - 1); r.date = ymd(d); }
    const cats = meta.cats[r.type].filter((c) => !c.archived);
    let cat = cats.find((c) => text.includes(c.name));
    if (!cat && r.type === "exp") { for (const [id, re] of Object.entries(CAT_WORDS)) if (re.test(text)) { cat = cats.find((c) => c.id === id); if (cat) break; } }
    if (cat) r.cat = cat.id;
    const accts = meta.accounts.filter((a) => !a.archived);
    let a = accts.find((x) => text.includes(x.name));
    if (!a && /微信/.test(text)) a = accts.find((x) => /微信/.test(x.name));
    if (!a && /支付宝/.test(text)) a = accts.find((x) => /支付宝/.test(x.name));
    if (!a && /信用卡/.test(text)) a = accts.find((x) => x.type === "credit");
    if (!a && /现金/.test(text)) a = accts.find((x) => x.type === "cash");
    if (a) r.acct = a.id;
    let note = (m ? text.replace(m[0], " ") : text).replace(/[¥￥]/g, "").replace(/(今天|昨天|昨晚|前天)/g, "");
    if (a) note = note.split(a.name).join("");
    r.note = note.replace(/(订单号|交易单号|商户单号|流水号|单号)[:：]?\s*[\w-]+/g, "").replace(/\d{4}[-/年]\d{1,2}[-/月]\d{1,2}日?/g, "").replace(/\d{1,2}:\d{2}(:\d{2})?/g, "").replace(/\d{6,}/g, "")
      .replace(/(微信支付|微信|支付宝|信用卡|现金|支付成功|付款成功|交易成功|Apple Pay|完成|返回商家)/gi, "").replace(/\s+/g, " ").trim().slice(0, 24);
    return r;
  }

  /* ---------- 付款截图 / 小票文字（OCR 结果）解析 ---------- */
  function parseReceipt(raw, meta, today) {
    let text = String(raw || "").replace(/\r/g, "")
      .replace(/([\u3400-\u9fff])[ \t]+(?=[\u3400-\u9fff])/g, "$1")   // OCR 常把汉字之间识别出空格
      .replace(/[：:]\s*/g, "：")
      .replace(/(\d)\s*[.,，。]\s*(\d{2})(?!\d)/g, "$1.$2")
      .replace(/[￥¥Y羊半辛筆]\s*(?=-?\s*\d)/g, "¥")                        // OCR 常把 ¥ 认成 Y、羊、半
      .replace(/(^|\n)[ \t]*[一—–－][ \t]*(?=\d+\.\d{2}(?!\d))/g, "$1-");  // 把负号认成汉字「一」
    const lines = text.split(/\n+/).map((s) => s.trim()).filter(Boolean);
    const out = { type: "exp", amount: null, merchant: "", date: null, pay: "", cat: null };
    const MONEY = /(\d{1,3}(?:,\d{3})+|\d+)\.(\d{2})(?!\d)/;
    const num = (m) => parseYuan(m[1].replace(/,/g, "") + "." + m[2]);
    let amtLine = -1;
    const tries = [/¥\s*-?\s*((?:\d{1,3}(?:,\d{3})+|\d+))\.(\d{2})/, /^[-−—]\s*((?:\d{1,3}(?:,\d{3})+|\d+))\.(\d{2})$/, /^[+＋]\s*((?:\d{1,3}(?:,\d{3})+|\d+))\.(\d{2})$/,
      /(?:实付款|实付|支付金额|付款金额|交易金额|订单金额|合计|应付|总计|金额)[^\d\n]{0,6}?((?:\d{1,3}(?:,\d{3})+|\d+))\.(\d{2})/, /^((?:\d{1,3}(?:,\d{3})+|\d+))\.(\d{2})$/];
    for (const re of tries) {
      for (let i = 0; i < lines.length; i++) { const m = lines[i].match(re); if (m) { out.amount = num(m); amtLine = i; if (/^[+＋]/.test(lines[i])) out.type = "inc"; break; } }
      if (out.amount) break;
    }
    if (!out.amount) { const m = text.match(/¥\s*-?\s*(\d{1,6})(?![\d.])/); if (m) out.amount = parseYuan(m[1]); }   // ¥20 这种整数
    if (!out.amount) { const all = [...text.matchAll(new RegExp(MONEY.source, "g"))].map((m) => num(m)).filter((v) => v > 0); if (all.length) out.amount = Math.max(...all); }
    const NOISE = /(支付成功|付款成功|交易成功|当前状态|完成|返回|账单详情|全部账单|微信支付|支付宝|中国移动|中国联通|中国电信|\d{1,2}：\d{2}|^[\d\s%]+$|5G|4G|LTE|订单号|单号|时间|积分|贴纸|领取|更多)/;
    // 截图里左边一列的标签，识别时常被单独读成一段，不能当成商户
    const LABEL = /^(支付时间|付款时间|创建时间|付款方式|支付方式|商品说明|商品|支付奖励|收款方全称|收款方|商户全称|商户名称|商户单号|交易单号|订单号|账单管理|账单分类|计入收支|计入收文|标签|备注|更多|当前状态|支付优惠|转账说明|对方账户)[：]?$/;
    const okName = (v) => v && v.length >= 2 && v.length <= 30 && !NOISE.test(v) && !LABEL.test(v) && !MONEY.test(v) && /[㐀-鿿A-Za-z]{2}/.test(v);
    // 1) 金额正上方的一行通常就是商户名（微信、支付宝的成功页和账单详情都是这样）
    if (amtLine > 0) for (let i = amtLine - 1; i >= Math.max(0, amtLine - 3); i--) { const v = lines[i].replace(/^[<‹\[\]|]+\s*/, "").trim(); if (okName(v)) { out.merchant = v; break; } }
    // 2) 平台订单的商品说明：「店名-美团App-订单号」→ 取店名
    if (!out.merchant || /^(美团|饿了么|淘宝|天猫|京东|拼多多)$/.test(out.merchant)) {
      const joined = lines.join("\n");
      const m = joined.match(/([^\n]{2,40}?)[-–—]\s*\n?\s*(美团App|美团|饿了么|淘宝|天猫|京东|拼多多|大众点评)[^\n]*\d{6,}/);
      if (m) { const shop = m[1].replace(/^(商品说明|商品)[：]?/, "").trim(); if (okName(shop) || shop.length > 30) out.merchant = shop.slice(0, 30); }
    }
    // 3) 关键字行：值在同一行；或下一行（下一行不能是另一个标签）
    const KEYS = [/^(收款方全称|收款方|商户全称|商户名称|商家|交易对方|对方账户|收款人|付款给)[：]?(.*)$/, /^(商品说明|商品)[：]?(.*)$/];
    for (const K of KEYS) for (let i = 0; i < lines.length && !out.merchant; i++) {
      const m = lines[i].match(K);
      if (m) { const v = (m[2] || "").trim() || (lines[i + 1] || ""); if (okName(v)) out.merchant = v; }
    }
    // 4) 小票：第一行一般是店名
    if (!out.merchant && lines[0] && lines[0].length <= 20 && okName(lines[0])) out.merchant = lines[0];
    out.merchant = out.merchant.replace(/[>›»]+$/, "").replace(/\s*([（）()：:·・\-–—])\s*/g, "$1").replace(/([㐀-鿿])\s+(?=[㐀-鿿])/g, "$1").trim().slice(0, 30);
    const pm = text.match(/(?:支付方式|付款方式)[：]?[ \t]*([^\n]{2,20})/) || text.match(/(零钱通|零钱|花呗|余额宝|账户余额|信用卡|储蓄卡|借记卡)/);
    if (pm) out.pay = pm[1].trim();
    const dm = text.match(/(20\d{2})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
    if (dm) { const d = dm[1] + "-" + pad(+dm[2]) + "-" + pad(+dm[3]); if (/^\d{4}-\d{2}-\d{2}$/.test(d) && d <= today) out.date = d; }
    if (/(收款成功|已收款|已存入|收到转账|转入成功|退款成功)/.test(text) && !/付款成功|支付成功/.test(text)) out.type = "inc";
    const plat = text.match(/(美团|饿了么|大众点评|滴滴|高德打车|12306|淘宝|天猫|京东|拼多多|抖音)/);
    out.hint = plat ? plat[1] : "";
    if (out.pay && /零钱/.test(out.pay)) out.pay = "微信 " + out.pay;
    if (out.pay && /(花呗|余额宝|账户余额)/.test(out.pay)) out.pay = "支付宝 " + out.pay;
    return out;
  }

  /** 只认数字的识别结果里找金额：整段必须像 -23.80 / ¥19.90 / 45.00；优先带符号的，其次最大的 */
  function amountFromDigits(raw) {
    const toks = String(raw || "").replace(/(\d)\s*[,，]\s*(\d{2})(?!\d)/g, "$1.$2").split(/\s+/).map((t) => t.replace(/^[,.]+|[,]+$/g, ""));
    const money = toks.filter((t) => /^[-+¥]?\d{1,7}\.\d{2}$/.test(t));
    if (!money.length) return null;
    const signed = money.filter((t) => /^[-+¥]/.test(t));
    const pick = (signed.length ? signed : money).map((t) => ({ t, v: parseYuan(t.replace(/^[-+¥]/, "")) })).sort((a, b) => b.v - a.v)[0];
    return { amount: pick.v, income: pick.t.startsWith("+") };
  }

  /* ---------- CSV ---------- */
  const CSV_HEAD = ["ID", "日期", "类型", "金额", "分类", "账户", "转入账户", "备注", "标签", "关联ID", "报销垫付", "分摊月数"];
  function csvCell(v) { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCSV(meta, txs) {
    const an = (id) => (acctById(meta, id) || {}).name || "";
    const cn = (id) => (catById(meta, id) || {}).name || "";
    const rows = live(txs).slice().sort((a, b) => a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0)).map((t) => [
      t.id, t.date, TYPE_NAMES[t.type], (t.amount / 100).toFixed(2),
      t.type === "tr" ? "" : cn(t.cat), an(t.acct), t.type === "tr" ? an(t.to) : "",
      t.note || "", (t.tags || []).join(" "), t.refId || "", t.reimbursable ? "是" : "", t.amort > 1 ? t.amort : "",
    ]);
    return "﻿" + [CSV_HEAD, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n");
  }
  function parseCSV(text) {
    text = String(text).replace(/^﻿/, "");
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ""));
  }
  /** 导入：返回待写入的账单、需新建的账户/分类、错误行，由界面预览后再确认 */
  function importCSV(text, meta, txs) {
    const rows = parseCSV(text);
    if (!rows.length) return { error: "文件是空的" };
    const head = rows[0].map((h) => h.trim());
    const col = (n) => head.indexOf(n);
    for (const n of ["日期", "类型", "金额"]) if (col(n) < 0) return { error: L("缺少「" + n + "」列。请使用本应用导出的格式。", "Missing the “" + n + "” column. Please use a file exported by this app.") };
    const m2 = JSON.parse(JSON.stringify(meta));
    const newAccts = [], newCats = [], errors = [], out = [];
    const existing = new Set(txs.map((t) => t.id));
    let dup = 0;
    const getAcct = (name) => {
      name = (name || "").trim(); if (!name) return null;
      let a = m2.accounts.find((x) => x.name === name);
      if (!a) { a = { id: uid("a_"), name, type: /信用卡/.test(name) ? "credit" : "wallet", init: 0 }; m2.accounts.push(a); newAccts.push(a); }
      return a.id;
    };
    const getCat = (type, name) => {
      name = (name || "").trim() || "其他";
      let c = m2.cats[type].find((x) => x.name === name);
      if (!c) { c = { id: uid(type === "exp" ? "c_" : "i_"), name, icon: "📦" }; m2.cats[type].push(c); newCats.push({ type, ...c }); }
      return c.id;
    };

  if (!x || typeof x.amount !== "number" || !(x.type === "exp" || x.type === "inc") || !/^\d{4}-\d{2}-\d{2}$/.test(x.date || "")) return null;
  const map = { 生活费: "i_allow", 话费: "c_phone", 奖学金: "i_scholar", 工资: "i_salary", 兼职: "i_part", 红包: "i_red" };
  const list = S.meta.cats[x.type];
  const c = list.find((k) => k.name === x.cat) || list.find((k) => k.id === map[x.cat]) || list.find((k) => k.name === "其他");
  return { id, type: x.type, amount: Math.round(x.amount * 100), cat: c ? c.id : list[0].id, acct: "a_wx", date: x.date, note: x.note || "", tags: [], ts: x.ts || 0 };
}

const sheets = [];
function openSheet(o) {
  const mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-body"></div></div>`;
  document.body.appendChild(mask);
  const sh = { ...o, mask, body: $(".sh-body", mask) };
  if (o.form) mask.firstElementChild.classList.add("formsheet");
  sheets.push(sh);
  mask.addEventListener("click", (e) => { if (e.target === mask) closeSheet(); });
  paintSheet(sh);
  document.body.style.overflow = "hidden";
  return sh;
}
function paintSheet(sh) {
  const st = sh.mask.firstElementChild.scrollTop; sh.body.innerHTML = sh.render(sh); sh.mount && sh.mount(sh.body, sh); sh.mask.firstElementChild.scrollTop = st;
  // 横向滚动的选项里，已选中的那个滚到可见位置
  sh.body.querySelectorAll(".chips .chip.on").forEach((el) => { const p = el.parentElement; if (el.offsetLeft + el.offsetWidth > p.clientWidth + p.scrollLeft) p.scrollLeft = el.offsetLeft - p.clientWidth / 2 + el.offsetWidth / 2; });
}
function closeSheet() {
  const sh = sheets.pop();
  if (sh) {
    const m = sh.mask; m.classList.add("closing"); setTimeout(() => m.remove(), REDUCED ? 0 : 170);
    sh.onClose && sh.onClose();
  }
  const top = topSheet(); if (top && top.dirty) { top.dirty = false; paintSheet(top); }
  if (!sheets.length) { document.body.style.overflow = ""; if (S.dirty) setTimeout(render, REDUCED ? 0 : 175); }
}
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function repaintLive() { sheets.forEach((sh, i) => { if (!sh.live) return; if (i === sheets.length - 1) { sh.dirty = false; paintSheet(sh); } else sh.dirty = true; }); }

let toastT = null;
function toast(msg, opt = {}) {
  let el = $("#toast"); if (el) el.remove(); clearTimeout(toastT);
  el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = `<span>${esc(msg)}</span>${opt.undo ? '<button>撤销</button>' : ""}`;
  document.body.appendChild(el);

function trKind(t) {

  if (b && b.type === "credit") return "信用卡还款";
  if (b && b.type === "loan") return "还款";
  if (a && a.type === "loan") return "借入";
  if (b && b.type === "receivable") return t.group ? "AA 待收" : "借出";
  if (a && a.type === "receivable") return t.group || t.aaPay ? L("AA 收款", "AA repaid") + (t.aaWho ? " · " + N(t.aaWho) : "") : "收回";

}
function txTitle(t) {

/* 有金额的支出/收入直接记入，不用确认；记错了点撤销 */
async function autoSavePending() {
  if (!ANDROID || !S.ready || S.autoBusy) return;
  let on = true; try { on = window.AndroidBridge.getAutoSave(); } catch (e) {}
  if (!on) return;
  const list = S.pending.filter((p) => p.auto && p.amount > 0 && (p.type === "exp" || p.type === "inc"));
  if (!list.length) return;
  S.autoBusy = true;
  const saved = [], st = S.meta.settings;
  try {
    for (const p of list) {
      const ty = p.type;
      const q = C.parseQuick([p.merchant, p.raw].filter(Boolean).join(" ").slice(0, 300), S.meta, today());
      const qa = C.parseQuick([p.account, p.source].filter(Boolean).join(" "), S.meta, today());
      const live = accts((a) => !a.archived);
      let ac = qa.acct;
      if (!ac && /花呗/.test(p.account)) ac = (live.find((a) => /花呗/.test(a.name)) || live.find((a) => a.type === "credit") || {}).id;
      if (!ac && /银行|储蓄/.test(p.account)) ac = (live.find((a) => a.type === "bank") || {}).id;
      if (!ac) ac = acct(st.lastAcct) && !acct(st.lastAcct).archived ? st.lastAcct : (live[0] || {}).id;
      let c = q.type === ty && q.cat ? q.cat : st.lastCat[ty];
      if (!S.meta.cats[ty].some((x) => x.id === c && !x.archived)) c = firstCat(ty);
      const t = { id: C.uid("t_"), type: ty, amount: p.amount, cat: c, acct: ac, date: C.ymd(new Date(p.time)), note: (p.merchant || "").slice(0, 30), tags: [], ts: Date.now() };
      await Store.putTx(t);
      try { window.AndroidBridge.removePending(p.id); } catch (e) {}
      saved.push(t);
    }
  } catch (e) {} finally { S.autoBusy = false; }
  if (!saved.length) return;
  try { S.pending = JSON.parse(window.AndroidBridge.getPending()) || []; } catch (e) {}

function drillData(q) {
  const p = new URLSearchParams(q), k = p.get("k"), ym = p.get("ym"), d = D();
  let ls = [], title = "", note = "";
  const amortTxt = S.meta.settings.amortView ? L("当前为「大额按月分摊」口径，分摊账单只计入当月那一份。", "Large items are spread monthly; only this month's share of each is counted.") : "";
  if (k === "pending") {
    const pr = C.pendingReimb(d.txs);
    return { title: "待报销", total: pr.reduce((s, x) => s + x.left, 0), rows: pr.map((x) => ({ t: x.tx, line: { amt: x.left, kind: "spend", part: "", refund: false } })), note: "垫付的钱不算你的消费。在账单详情里点「收到报销」记录到账，金额会自动冲回。" };
  }
  if (k === "fixedYear") {
    const from = C.addMonths(C.ymOf(today()), -11);
    const rows = d.live.filter((t) => t.type === "exp" && (cat(t.cat) || {}).fixed && C.ymOf(t.date) >= from).sort(sortTx).map((t) => ({ t }));
    return { title: "近 12 个月固定/大额支出", total: rows.reduce((s, r) => s + r.t.amount, 0), rows, note: "这些支出发生得不频繁但金额大。可以在账单里设置「按月分摊」，再在统计页切换口径查看每月的真实负担。" };
  }
  if (k === "spend" || k === "budget" || k === "balance") {
    ls = d.lines.filter((l) => l.kind === "spend" && l.ym === ym);
    if (k === "budget" && !S.meta.budgets.includeFixed) ls = ls.filter((l) => !l.fixed);
    if (p.get("fixed") === "0") ls = ls.filter((l) => !l.fixed);
    if (p.get("fixed") === "1") ls = ls.filter((l) => l.fixed);
    if (p.get("cat")) ls = ls.filter((l) => l.cat === p.get("cat"));
    if (p.get("acct")) ls = ls.filter((l) => l.acct === p.get("acct"));
    const c = p.get("cat") && cat(p.get("cat"));
    const who = c ? N(c.name) : p.get("acct") ? aName(p.get("acct")) : "", fx = p.get("fixed");
    title = L(ymLabel(ym) + (who ? "「" + who + "」" : "") + (fx === "0" ? "日常" : fx === "1" ? "固定/大额" : "") + (k === "budget" ? "预算已用" : "支出"),
      (k === "budget" ? "Budget used" : (fx === "0" ? "Daily spending" : fx === "1" ? "Fixed / large spending" : "Spending")) + (who ? " · " + who : "") + " · " + ymLabel(ym));
    note = L("由下面这些账单相加得出：支出减去关联的退款。转账、信用卡还款、借出借入、报销垫付都不计入。", "The sum of the bills below: spending minus linked refunds. Transfers, card repayments, loans and reimbursable advances are excluded. ") + amortTxt;
  }
  if (k === "income" || k === "balance") {
    const inc = d.lines.filter((l) => l.kind === "income" && l.ym === ym);
    if (k === "income") { ls = inc; title = L(ymLabel(ym) + "收入", "Income · " + ymLabel(ym)); note = L("只统计收入类账单。退款、报销到账、转入和收回借款都不算收入。", "Only income bills. Refunds, reimbursements, transfers in and repaid loans are not income."); }
    else { ls = [...inc, ...ls]; title = L(ymLabel(ym) + "结余", "Balance · " + ymLabel(ym)); note = L("结余 = 收入 − 支出。", "Balance = income − spending. ") + amortTxt; }
  }
  if (k === "cmp") {
    const prev = C.addMonths(ym, -1), c = cat(p.get("cat"));
    const cut = Number(p.get("cut") || 0);
    ls = d.lines.filter((l) => l.kind === "spend" && (l.ym === ym || l.ym === prev) && l.cat === p.get("cat") && (!cut || l.part || Number(l.tx.date.slice(8, 10)) <= cut));
    title = (c ? N(c.name) : "") + L("：", ": ") + mLabel(prev) + " vs " + mLabel(ym);
    const a = C.sum(ls.filter((l) => l.ym === ym)), b = C.sum(ls.filter((l) => l.ym === prev));
    return { title, total: a - b, totalLabel: "变化", rows: ls.slice().sort((x, y) => y.tx.date.localeCompare(x.tx.date)).map((l) => ({ t: l.tx, line: l })), note: L(`${ymLabel(ym)} ${Y(a)}，${ymLabel(prev)} ${Y(b)}${cut ? "（都只算 1–" + cut + " 日）" : ""}。下面列出参与比较的全部账单。`, `${ymLabel(ym)}: ${Y(a)}; ${ymLabel(prev)}: ${Y(b)}${cut ? ` (days 1–${cut} only)` : ""}. All bills in the comparison are listed below.`) };
  }
  const total = k === "balance" ? C.sum(ls.filter((l) => l.kind === "income")) - C.sum(ls.filter((l) => l.kind === "spend")) : C.sum(ls);
  return { title, total, rows: ls.slice().sort((x, y) => sortTx(x.tx, y.tx)).map((l) => ({ t: l.tx, line: l })), note };
}

async function deleteTxs(ids) {
  const d = D(), now = Date.now(), set = new Set();
  for (const id of ids) {
    set.add(id);
    const t = S.txs.get(id); if (!t) continue;
    for (const x of C.linked(d.txs, id)) set.add(x.id);
    if (t.group && !t.aaPay && !t.aaWaive) for (const x of d.live) if (x.group === t.group) set.add(x.id);
  }
  const list = [...set].map((id) => S.txs.get(id)).filter((t) => t && !t.deleted);
  const ops = list.map((t) => ({ id: t.id, data: { ...t, deleted: now } }));
  const fail = await Store.bulk(ops);
  if (fail) toast(L("有 " + fail + " 笔删除失败，请重试", fail + " deletions failed, please retry"));
  else toast(list.length > 1 ? L(`已删除 ${list.length} 笔（含关联账单）`, `Deleted ${list.length} (with linked bills)`) : L("已删除", "Deleted"), { undo: () => restoreTxs(list.map((t) => t.id)) });
}
async function restoreTxs(ids) {
  const ops = ids.map((id) => S.txs.get(id)).filter(Boolean).map((t) => { const x = { ...t }; delete x.deleted; return { id: t.id, data: x }; });
  await Store.bulk(ops); toast(L("已恢复 " + ops.length + " 笔", "Restored " + ops.length));
}

  const ym = S.ym, d = D(), sm = C.monthSummary(d.lines, ym);

  h += `<div class="card hero"><div class="lab">支出</div><div class="big num tap" data-a="drill" data-q="k=spend&ym=${ym}">${Y(sm.spend)}</div>
    <div class="split-note"><button class="pill" data-a="drill" data-q="k=spend&ym=${ym}&fixed=0">日常 ${Y(sm.daily)}</button><button class="pill" data-a="drill" data-q="k=spend&ym=${ym}&fixed=1">固定/大额 ${Y(sm.fixed)}</button></div>
    <div class="grid3"><div class="tap" data-a="drill" data-q="k=income&ym=${ym}"><div class="lab">收入</div><div class="v inc">${Y(sm.income)}</div></div><div class="tap" data-a="drill" data-q="k=balance&ym=${ym}"><div class="lab">结余</div><div class="v">${Y(sm.income - sm.spend)}</div></div><div class="tap" data-a="drill" data-q="k=spend&ym=${ym}"><div class="lab">笔数</div><div class="v num">${new Set(sm.spendLines.map((l) => l.tx.id)).size}</div></div></div></div>`;
  // 构成
  const max = sm.byCat.length ? Math.max(...sm.byCat.map((g) => g.amt)) : 1;
  h += `<div class="card"><div class="card-h"><h2>消费构成</h2></div>${sm.byCat.length ? sm.byCat.map((g) => catRow(g, max, sm.spend, ym)).join("") : `<p class="small muted" style="margin:0">这个月还没有支出</p>`}</div>`;
  // 趋势
  h += trendCard(ym);
  // 变化
  const cut = ym === C.ymOf(today()) ? Number(today().slice(8)) : 0;
  const ch = C.categoryChanges(d.lines, ym, cut).slice(0, 4);
  if (ch.length) {
    h += `<div class="card"><div class="card-h"><h2>${cut ? "和上月同期比" : "和上月比"}</h2><span class="tiny muted">${cut ? L("1–" + cut + " 日", "Days 1–" + cut) : mLabel(C.addMonths(ym, -1)) + " → " + mLabel(ym)}</span></div>${ch.map((x) => {
      const c = cat(x.cat) || { name: "未分类", icon: "📦" }, up = x.diff > 0;
      const why = x.top.length ? (up ? L("主要来自：", "Mostly from: ") : L("上月有而本月少了：", "Last month had: ")) + x.top.map((l) => short(l.tx.date) + (l.tx.note ? " " + esc(N(l.tx.note).slice(0, 12)) : "") + " " + F$(l.amt)).join("、") : "";
      return `<div class="crow tap" data-a="drill" data-q="k=cmp&ym=${ym}&cat=${esc(x.cat)}&cut=${cut}" role="button">${catIco(c)}<div class="mid"><div>${esc(N(c.name))} <span class="${up ? "warn" : "inc"} num">${up ? "↑" : "↓"} ${F$(Math.abs(x.diff))}</span></div>
        <div class="tiny muted">${F$(x.before)} → ${F$(x.now)}${why ? " · " + why : ""}</div></div><span class="muted">›</span></div>`;
    }).join("")}</div>`;
  }
  // 账户去向
  if (sm.byAcct.length) {
    const mx = Math.max(...sm.byAcct.map((g) => g.amt));
    h += `<div class="card"><div class="card-h"><h2>从哪些账户花出</h2></div>${sm.byAcct.map((g) => { const a = acct(g.key);
      return `<div class="crow tap" data-a="drill" data-q="k=spend&ym=${ym}&acct=${esc(g.key)}" role="button">${acctIco(a)}<div class="mid"><div class="brow" style="margin:0"><span>${esc(aName(g.key))}</span>${a && a.type === "credit" ? '<span class="tag">计入负债</span>' : ""}</div><div class="bar"><i style="width:${pct(g.amt, mx)}%"></i></div></div><span class="v num">${F$(g.amt)}</span></div>`; }).join("")}</div>`;
  }
  const adv = d.lines.filter((l) => l.kind === "adv" && l.ym === ym);
  if (adv.length) {
    const paid = C.sum(adv.filter((l) => l.amt > 0)), back = -C.sum(adv.filter((l) => l.amt < 0));
    h += `<div class="card tap" data-a="drill" data-q="k=pending" role="button"><div class="card-h"><h2>报销垫付</h2><span class="muted">›</span></div><div class="small ink2">${L("本月垫付 ", "Advanced this month ")}${Y(paid)}${L(" · 收到报销 ", " · reimbursed ")}${Y(back)}</div></div>`;
  }
  return h;
}
function trendCard(ym) {
  const d = D(), months = [...Array(6)].map((_, i) => C.addMonths(ym, i - 5));
  const data = months.map((m) => { const s = C.monthSummary(d.lines, m); return { m, sp: s.spend, inc: s.income }; });
  const max = Math.max(1, ...data.map((x) => Math.max(x.sp, x.inc)));
  const W = 336, H = 150, top = 14, bot = 22, gw = W / 6, bw = 15;
  const yv = (v) => H - bot - (Math.max(0, v) / max) * (H - top - bot);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近6个月收支趋势">`;
  s += `<line x1="0" x2="${W}" y1="${H - bot}" y2="${H - bot}" style="stroke:var(--line)"/>`;
  data.forEach((x, i) => {
    const cx = gw * i + gw / 2, on = x.m === ym, op = on ? 1 : 0.55;
    s += `<g class="tap" data-a="trend" data-m="${x.m}" style="cursor:pointer"><rect x="${gw * i}" y="0" width="${gw}" height="${H}" fill="transparent"/>`;
    s += `<rect x="${cx - bw - 1}" y="${yv(x.sp)}" width="${bw}" height="${H - bot - yv(x.sp)}" rx="3" style="fill:var(--accent);opacity:${op}"/>`;
    s += `<rect x="${cx + 1}" y="${yv(x.inc)}" width="${bw}" height="${H - bot - yv(x.inc)}" rx="3" style="fill:var(--c2);opacity:${op}"/>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" style="${on ? "fill:var(--ink);font-weight:600" : ""}">${mLabel(x.m)}</text></g>`;
  });
  s += `</svg>`;
  const cur = data[5], avg = Math.round(data.reduce((a, x) => a + x.sp, 0) / 6);
  return `<div class="card chart"><div class="card-h"><h2>近 6 个月</h2></div>${s}
    <div class="legend"><span><i style="background:var(--accent)"></i>${L("支出 ", "Out ")}${F$(cur.sp)}</span><span><i style="background:var(--c2)"></i>${L("收入 ", "In ")}${F$(cur.inc)}</span><span style="margin-left:auto">${L("6 月平均支出 ", "6-mo avg out ")}${F$(avg)}</span></div></div>`;
}

/* --- 拍照 / 截图识别：Claude 版用 Claude 看图；离线版用 Tesseract（首次需联网下载模型）。结果只预填，需用户确认 --- */
async function shrink(file, max = 1600) {
  try {

    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

/** 给 OCR 用：转灰度、深色模式截图反色成白底黑字、太小就放大、拉开对比度 */
async function prepForOcr(file) {

    const k = bmp.width < 1000 ? Math.min(2, 1200 / bmp.width) : 1;
    const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); g.drawImage(bmp, 0, 0, w, h);
    const im = g.getImageData(0, 0, w, h), p = im.data;
    let sum = 0; for (let i = 0; i < p.length; i += 4) sum += 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
    const dark = sum / (p.length / 4) < 110;
    for (let i = 0; i < p.length; i += 4) {
      let y = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
      if (dark) y = 255 - y;
      y = Math.max(0, Math.min(255, (y - 128) * 1.5 + 128));
      p[i] = p[i + 1] = p[i + 2] = y;
    }
    g.putImageData(im, 0, 0);
    return await new Promise((r) => c.toBlob((b) => r(b || file), "image/png"));
  } catch (e) { return file; }
}

    const dark = sum / (p.length / 4) < 110;

  if (!tessP) tessP = new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"; sc.onload = () => (window.Tesseract ? res(window.Tesseract) : rej(new Error("load"))); sc.onerror = () => { tessP = null; rej(new Error("load")); }; document.head.appendChild(sc); });
  return tessP;
}
async function recognize(file, status) {
  const img = await shrink(file);
  if (!PWA && window.claude && window.claude.use) {
    let sample = null; try { sample = await window.claude.use("sample"); } catch (e) {}
    if (sample) {
      let ok = false; try { ok = !!(await sample.limits()).images; } catch (e) {}
      if (ok) {
        status(L("正在用 Claude 识别…", "Reading with Claude…"));
        const cats = S.meta.cats.exp.filter((c) => !c.archived).map((c) => c.id + "=" + c.name).join(", ") + " | " + S.meta.cats.inc.filter((c) => !c.archived).map((c) => c.id + "=" + c.name).join(", ");
        const v = await sample.json(`这是一张付款或收款的照片/截图（可能来自微信、支付宝、银行 App、小票或发票）。只根据图片内容提取这一笔交易，回复 JSON：{"type":"exp"或"inc","amount":金额数字（元，正数，没有就 null）,"merchant":"商户或对方名称，没有就空字符串","date":"YYYY-MM-DD 或 null","category":"从这些分类 id 里选一个最合适的，拿不准就 null：${cats}","pay":"支付方式原文，如 零钱、花呗、招商银行信用卡，没有就空字符串"}。不要编造图片里没有的信息。`, { images: [img], modelTier: "quick" });
        return { via: "claude", type: v && v.type === "inc" ? "inc" : "exp", amount: v && v.amount != null ? C.parseYuan(String(v.amount)) : null, merchant: (v && v.merchant) || "", date: v && /^\d{4}-\d{2}-\d{2}$/.test(v.date || "") && v.date <= today() ? v.date : null, cat: v && C.catById(S.meta, v.category) ? v.category : null, pay: (v && v.pay) || "" };
      }
    }
  }
  status(L("正在载入识别模型（第一次需要联网，约 10–20 MB）…", "Loading the recognition model (first time needs internet, ~10–20 MB)…"));
  const prepped = await prepForOcr(file);
  const T = await loadTess();
  const worker = await T.createWorker(["chi_sim", "eng"], 1, { logger: (m) => { if (m.status === "recognizing text") status(L("正在识别文字… ", "Reading text… ") + Math.round(m.progress * 100) + "%"); } });
  let raw = "", r;
  try { const { data } = await worker.recognize(prepped); raw = data.text || ""; r = C.parseReceipt(raw, S.meta, today()); }
  finally { try { await worker.terminate(); } catch (e) {} }
  if (!r.amount) {
    // 大号粗体的金额常被漏读：把图缩小，用「稀疏文本 + 只认数字」再找一次
    status(L("正在单独识别金额…", "Looking for the amount…"));
    const w2 = await T.createWorker("eng", 1);
    try {
      await w2.setParameters({ tessedit_pageseg_mode: "11", tessedit_char_whitelist: "0123456789.,-+¥" });
      for (const k of [0.5, 0.33]) {
        const small = await scaledGray(file, k);
        const { data } = await w2.recognize(small);
        raw += "\n---- " + L("只认数字", "digits only") + " " + k + " ----\n" + (data.text || "");
        const d = C.amountFromDigits(data.text);
        if (d) { r.amount = d.amount; if (d.income) r.type = "inc"; break; }
      }
    } finally { try { await w2.terminate(); } catch (e) {} }
  }
  return { via: "ocr", raw, ...r };
}
async function onPhoto(e) {
  const file = e.target.files && e.target.files[0]; if (!file || !F) return;
  const hint = (m) => { F.info = m; const h = $(".sheet .quick + .hint"); if (h) h.textContent = m; else refreshForm(); };
  hint(L("正在读取图片…", "Reading the image…"));
  try {
    const r = await recognize(file, hint);
    F.ocrRaw = r.raw || "";
    if (!r.amount) { F.info = L("未识别到金额", "No amount found"); refreshForm(); return; }
    const q = C.parseQuick([r.merchant, r.pay, r.hint].filter(Boolean).join(" "), S.meta, today());
    const type = r.type === "inc" ? "inc" : "exp";
    Object.assign(F, { type, expr: centsToExpr(r.amount), note: (r.merchant || "").slice(0, 30) || F.note, date: r.date || F.date });
    const cat = r.cat && S.meta.cats[type].some((c) => c.id === r.cat && !c.archived) ? r.cat : q.type === type && q.cat ? q.cat : null;
    if (cat) F.cat = cat; else if (!S.meta.cats[type].some((c) => c.id === F.cat)) F.cat = firstCat(type);
    if (q.acct) F.acct = q.acct;
    F.info = [TN(type), "¥" + F$(r.amount), r.merchant, short(F.date)].filter(Boolean).join(" · ");
    refreshForm();
  } catch (x) {
    F.info = /load|fetch|network/i.test(String(x && x.message)) ? L("识别模型下载失败", "Could not download the model") : L("识别失败", "Recognition failed");
    refreshForm();
  }
}

async function hashPin(pin, salt) {
  try { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pin)); return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join(""); }
  catch (e) { let h = 5381; for (const ch of salt + pin) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return "d" + (h >>> 0).toString(16); }
}
function pinPad(id) { return `<div class="dots" id="${id}D">${[0, 1, 2, 3].map(() => "<i></i>").join("")}</div><div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map((k) => k === "" ? "<span></span>" : `<button data-a="pin" data-v="${k}" aria-label="${k === "⌫" ? "退格" : k}">${k}</button>`).join("")}</div>`; }
let PIN = null;
function paintDots() { const el = document.getElementById(PIN.dots); if (el) [...el.children].forEach((d, i) => d.classList.toggle("on", i < PIN.val.length)); }
function showLock() {
  if ($("#lock")) return;
  const el = document.createElement("div"); el.id = "lock"; el.className = "lock";
  el.innerHTML = `${uiIco("lock", "xl")}<div style="font-weight:600;margin-top:6px">输入密码</div>${pinPad("lk")}<button class="link" data-a="forgot" style="margin-top:18px">忘记密码</button><div class="err" id="lkE"></div>`;
  document.body.appendChild(el);
  PIN = { val: "", dots: "lkD", done: async (v) => {
    const LK = S.meta.settings.lock;
    if ((await hashPin(v, LK.salt)) === LK.hash) { S.unlocked = true; el.remove(); PIN = null; render(); }
    else { $("#lkE").textContent = "密码不对，再试一次"; PIN.val = ""; paintDots(); }
  } };
}
function openLockSet() {
  const LK = S.meta.settings.lock;
  if (LK && LK.hash) {
    openSheet({ render: () => shHead("关闭应用锁") + `<p class="small ink2" style="text-align:center">输入当前密码</p><div style="display:flex;flex-direction:column;align-items:center">${pinPad("ls")}</div><div class="err" id="lsE" style="text-align:center"></div>`,
      mount: () => { PIN = { val: "", dots: "lsD", done: async (v) => { if ((await hashPin(v, LK.salt)) === LK.hash) { const m = meta2(); delete m.settings.lock; await Store.putMeta(m); closeSheet(); toast("应用锁已关闭"); } else { $("#lsE").textContent = "密码不对"; PIN.val = ""; paintDots(); } } }; }, onClose: () => (PIN = null) });
    return;
  }
  let first = null;
  openSheet({ render: () => shHead("设置 4 位密码") + `<p class="small ink2" style="text-align:center" id="lsT">输入新密码</p><div style="display:flex;flex-direction:column;align-items:center">${pinPad("ls")}</div>`,
    mount: () => { PIN = { val: "", dots: "lsD", done: async (v) => {
      if (!first) { first = v; PIN.val = ""; paintDots(); $("#lsT").textContent = "再输入一次确认"; return; }
      if (v !== first) { first = null; PIN.val = ""; paintDots(); $("#lsT").textContent = "两次不一致，请重新输入"; return; }
      const salt = Math.random().toString(36).slice(2, 10); const m = meta2(); m.settings.lock = { salt, hash: await hashPin(v, salt) };
      S.unlocked = true; await Store.putMeta(m); closeSheet(); toast("应用锁已开启");
    } }; }, onClose: () => (PIN = null) });
}
